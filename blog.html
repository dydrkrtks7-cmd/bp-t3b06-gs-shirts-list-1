    <style>
        /* CSS 리셋 + 브루탈리스트 DNA */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 모든 요소에 기본적인 raw 스타일 */
        img, svg, video, canvas {
            max-width: 100%;
            display: block;
        }
        a {
            color: #ff2a6d;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
        }
        a:hover {
            border-bottom-color: #ff2a6d;
        }
        /* 타이포그래피 - 오버사이즈, 굵게 */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #ffffff;
        }
        h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 1rem;
        }
        h2 {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }
        h3 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }
        p {
            margin-bottom: 1.25rem;
            font-size: 1.125rem;
        }
        /* 공간 설정: airy */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        /* 상단 네비게이션 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: #111;
            border-bottom: 3px solid #ff2a6d;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .logo a {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            border: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .navbar .logo a:hover {
            color: #ff2a6d;
            border: none;
        }
        .navbar .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        .navbar .nav-links a {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ccc;
            border: none;
            padding: 0.25rem 0;
            position: relative;
        }
        .navbar .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: #ff2a6d;
            transition: width 0.3s;
        }
        .navbar .nav-links a:hover::after {
            width: 100%;
        }
        .navbar .nav-links a.active {
            color: #ff2a6d;
        }
        /* 햄버거 버튼 (모바일) */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.5rem;
        }
        .hamburger span {
            display: block;
            width: 28px;
            height: 3px;
            background-color: #fff;
            margin: 4px 0;
            transition: all 0.3s;
        }
        /* 히어로/블로그 헤더 */
        .hero {
            padding: 3rem 1.5rem;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 3px solid #ff2a6d;
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,42,109,0.5);
        }
        .hero p {
            font-size: 1.25rem;
            color: #b0b0b0;
            max-width: 700px;
            margin: 0 auto 1.5rem;
        }
        .hero .meta {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        /* 블로그 본문 카드 */
        .blog-card {
            background-color: #1a1a1a;
            border: 2px solid #333;
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 0;
            box-shadow: 8px 8px 0 #000;
        }
        .blog-card h2 {
            font-size: 2rem;
            color: #fff;
            border-left: 6px solid #ff2a6d;
            padding-left: 1rem;
        }
        .blog-card .subhead {
            color: #ff2a6d;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        .blog-card p {
            color: #d0d0d0;
        }
        .blog-card .highlight {
            background-color: #222;
            padding: 1rem;
            border-left: 4px solid #ff2a6d;
            margin: 1.5rem 0;
            font-weight: 600;
        }
        .blog-card .highlight strong {
            color: #ff2a6d;
        }
        /* 버튼 */
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background-color: #ff2a6d;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 4px 4px 0 #000;
            text-decoration: none;
            border: none;
        }
        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
            border: none;
        }
        .btn--tel {
            background-color: #00e5ff;
            color: #000;
        }
        .btn--tel::before {
            content: "📞 ";
        }
        /* 푸터 */
        footer {
            background-color: #111;
            padding: 2rem 1.5rem;
            text-align: center;
            border-top: 3px solid #ff2a6d;
            margin-top: auto;
        }
        footer p {
            color: #666;
            font-size: 0.9rem;
        }
        /* 반응형 768px */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            h2 { font-size: 1.8rem; }
            h3 { font-size: 1.3rem; }
            .container { padding: 1.5rem 1rem; }
            .navbar .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                right: 1rem;
                background-color: #111;
                border: 2px solid #ff2a6d;
                padding: 1rem;
                gap: 1rem;
                min-width: 200px;
            }
            .navbar .nav-links.open {
                display: flex;
            }
            .hamburger {
                display: flex;
            }
            .hero h1 { font-size: 2.2rem; }
            .blog-card { padding: 1.5rem; }
        }
        /* 작은 화면에서 추가 조정 */
        @media (max-width: 480px) {
            .hero { padding: 2rem 1rem; }
            .blog-card h2 { font-size: 1.5rem; }
        }
