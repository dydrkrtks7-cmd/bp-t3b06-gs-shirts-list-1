<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="1034" cy="707" r="30" fill="#1565c0" opacity="0.17"/>
    <circle cx="1219" cy="-90" r="85" fill="#1565c0" opacity="0.08"/>
    <circle cx="728" cy="-51" r="82" fill="#1565c0" opacity="0.08"/>
    <circle cx="346" cy="336" r="42" fill="#1565c0" opacity="0.15"/>
    <circle cx="729" cy="-74" r="25" fill="#1565c0" opacity="0.14"/>
    <circle cx="652" cy="491" r="21" fill="#1565c0" opacity="0.13"/>
    <rect x="1185" y="401" width="51" height="69" rx="8" fill="#0d47a1" opacity="0.10" transform="rotate(29, -90, 501)"/>
    <rect x="1028" y="680" width="33" height="88" rx="8" fill="#0d47a1" opacity="0.09" transform="rotate(43, 1065, 688)"/>
    <rect x="903" y="322" width="84" height="45" rx="8" fill="#0d47a1" opacity="0.05" transform="rotate(19, 229, 621)"/>
    <rect x="309" y="275" width="26" height="82" rx="8" fill="#0d47a1" opacity="0.12" transform="rotate(9, 163, 146)"/>
    <rect x="101" y="145" width="33" height="50" rx="8" fill="#0d47a1" opacity="0.09" transform="rotate(12, 952, 180)"/>
    <rect x="1230" y="151" width="32" height="51" rx="8" fill="#0d47a1" opacity="0.10" transform="rotate(14, 201, 47)"/>
    <rect x="-76" y="476" width="58" height="61" rx="8" fill="#0d47a1" opacity="0.14" transform="rotate(10, 945, 58)"/>
    <rect x="663" y="263" width="24" height="88" rx="8" fill="#0d47a1" opacity="0.08" transform="rotate(16, 8, 82)"/>
    <polygon points="39,439 101,563 -23,563" fill="#1565c0" opacity="0.11"/>
    <polygon points="890,273 962,417 818,417" fill="#1565c0" opacity="0.09"/>
    <polygon points="-29,-122 34,4 -92,4" fill="#1565c0" opacity="0.13"/>
    <polygon points="776,641 806,701 746,701" fill="#1565c0" opacity="0.06"/>

  <!-- Wave at bottom -->
  <path d="M0,540 C360,585 840,495 1200,540 L1200,630 L0,630Z" fill="#1565c0" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    강서 셔츠룸 모음
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    강서 — 셔츠룸
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#00bcd4" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#00bcd4" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    강서 강서 셔츠룸 모음 — 셔츠룸
  </text>
</svg>